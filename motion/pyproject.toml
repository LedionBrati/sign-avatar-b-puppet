[project]
name = "sbp-motion"
version = "0.1.0"
description = "MediaPipe landmark extraction, cleanup and QA for the VRM sign puppet (puppet/)"
requires-python = ">=3.11,<3.14"
dependencies = [
    "mediapipe==1.2.3",
    "numpy>=1.26",
    # cv2 comes from opencv-contrib-python, which mediapipe already depends on
    "scipy>=1.13",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
