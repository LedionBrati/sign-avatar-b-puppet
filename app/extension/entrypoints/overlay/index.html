<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="color-scheme" content="light" />
  <title>SIGNLAYER signer</title>
</head>
<body data-size="m" data-theme="light">
  <!-- One floating glass card: the signer is the hero, a status capsule on top, live captions underneath.
       Controls stay hidden until the card is hovered or focused. -->
  <main class="card" id="card" data-state="listening" role="region" aria-label="SIGNLAYER signer">
    <div class="stage" id="stage">
      <canvas class="still" id="still" aria-hidden="true"></canvas>
      <video id="v0" muted playsinline preload="auto" aria-hidden="true"></video>
      <video id="v1" muted playsinline preload="auto" aria-hidden="true"></video>
      <div class="veil" aria-hidden="true"></div>
      <div class="island" id="pill" role="status" data-tone="live">
        <span class="island-in" id="islandIn"><i class="dot" id="dot"></i><b id="pillState">Listening</b><em id="pillSub"></em></span>
      </div>
      <div class="focus" id="focus" aria-live="polite">
        <p class="focus-text" id="focusText"></p>
        <div class="focus-actions" id="noteActions"></div>
      </div>
      <div class="toolbar" id="bar" role="toolbar" aria-label="Signer controls">
        <button class="tb" id="sizeBtn" aria-label="Signer size"></button>
        <button class="tb" id="ccBtn" aria-label="Captions under the signer" aria-pressed="true"></button>
        <button class="tb" id="srcBtn" aria-label="What to listen to" aria-haspopup="menu" aria-expanded="false"></button>
        <button class="tb" id="closeBtn" aria-label="Hide the signer (Alt+Shift+K brings it back)"></button>
      </div>
      <div class="menu" id="srcMenu" role="menu" aria-label="Listen to" hidden></div>
    </div>
    <div class="sheet" id="sheet">
      <p class="cc" id="cc" aria-live="polite"></p>
      <p class="sheet-note" id="noteText"></p>
    </div>
  </main>
  <script type="module" src="./main.ts"></script>
</body>
</html>
