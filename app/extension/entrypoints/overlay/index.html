<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="color-scheme" content="light" />
  <title>Flux</title>
</head>
<body>
  <!-- The floating card (inside the page's glass frame, float.ts), like the web app's Live card: a minimal header
       (flux, a tiny status dot, gear, close), the voice wave with Mic | Tab and Start, the signer on a pastel halo,
       the transcript in the serif. Transparent: the frosted glass behind it belongs to the frame. -->
  <div class="card" id="card">
    <header class="hd" id="grip" title="Drag to move">
      <span class="brand" id="brand"></span>
      <i class="dot" id="dot" data-tone="idle" aria-hidden="true"></i>
      <span class="sr" id="pill" role="status">Ready</span>
      <span class="sp"></span>
      <button class="ib gear" id="gear" aria-label="Settings" aria-expanded="false" aria-controls="server" title="Settings"></button>
      <button class="ib" id="close" aria-label="Close Flux" title="Close"></button>
    </header>
    <form class="menu" id="server" hidden>
      <div class="row">
        <span class="lbl" id="sizeLbl">Size</span>
        <div class="seg sz" id="size" role="radiogroup" aria-labelledby="sizeLbl">
          <i class="thumb" aria-hidden="true"></i>
          <button type="button" role="radio" data-size="s" aria-checked="false">S</button>
          <button type="button" role="radio" data-size="m" aria-checked="true">M</button>
          <button type="button" role="radio" data-size="l" aria-checked="false">L</button>
        </div>
      </div>
      <div class="row">
        <label class="lbl" for="apiUrl">Server</label>
        <input id="apiUrl" type="url" spellcheck="false" autocomplete="off" />
        <button class="save" type="submit">Save</button>
      </div>
    </form>

    <section class="voice" id="voice" aria-label="Listening">
      <div class="seg src" id="seg" role="radiogroup" aria-label="Listen to">
        <i class="thumb" aria-hidden="true"></i>
        <button type="button" role="radio" data-src="mic" aria-checked="false" aria-label="Microphone" title="Microphone">Mic</button>
        <button type="button" role="radio" data-src="tab" aria-checked="true" aria-label="This tab's audio" title="This tab's audio">Tab</button>
      </div>
      <canvas class="wv" id="wv" aria-hidden="true"></canvas>
      <button class="go" id="go" aria-pressed="false" aria-label="Start listening" title="Start listening"><span class="go-ic" id="goIc"></span></button>
    </section>

    <main class="stage-wrap" id="stageWrap">
      <i class="halo" aria-hidden="true"></i>
      <div class="stage" id="stage" data-state="ready">
        <canvas class="still" id="still" aria-hidden="true"></canvas>
        <video id="v0" muted playsinline preload="auto" aria-hidden="true"></video>
        <video id="v1" muted playsinline preload="auto" aria-hidden="true"></video>
      </div>
    </main>

    <section class="sheet" aria-label="Transcript">
      <p class="cc" id="cc" aria-live="polite"></p>
    </section>
    <p class="note" id="note" role="alert"></p>
  </div>
  <script type="module" src="./main.ts"></script>
</body>
</html>
