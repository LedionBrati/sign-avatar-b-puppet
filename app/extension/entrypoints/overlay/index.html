<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="color-scheme" content="light" />
  <title>SIGNLAYER signer</title>
</head>
<body data-size="m">
  <main class="card" id="card" data-state="listening" role="region" aria-label="SIGNLAYER signer">
    <div class="stage" id="stage" title="Drag to any corner">
      <div class="studio" aria-hidden="true"></div>
      <video id="v0" muted playsinline preload="auto" aria-hidden="true"></video>
      <video id="v1" muted playsinline preload="auto" aria-hidden="true"></video>
      <canvas class="wave" id="wave" aria-hidden="true"></canvas>
      <div class="note" id="note" aria-live="polite">
        <span class="note-ic" id="noteIc" aria-hidden="true"></span>
        <b class="note-title" id="noteTitle"></b>
        <span class="note-text" id="noteText"></span>
        <span class="note-actions" id="noteActions"></span>
      </div>
      <span class="pill" id="pill" role="status"><i></i><b id="pillState">Listening</b><em id="pillSub"></em></span>
      <div class="bar" id="bar" role="toolbar" aria-label="Signer controls">
        <span class="grip" id="brand" aria-hidden="true"></span>
        <span class="sp"></span>
        <span class="sizes" role="group" aria-label="Signer size">
          <button data-size="s" aria-label="Small signer">S</button><button data-size="m" aria-label="Medium signer">M</button><button data-size="l" aria-label="Large signer">L</button>
        </span>
        <button class="ic" id="ccBtn" aria-label="Captions under the signer" aria-pressed="true"></button>
        <button class="ic" id="srcBtn" aria-label="What to listen to" aria-haspopup="menu" aria-expanded="false"></button>
        <button class="ic" id="closeBtn" aria-label="Hide the signer (Alt+Shift+K brings it back)"></button>
      </div>
      <div class="menu" id="srcMenu" role="menu" aria-label="Listen to" hidden></div>
    </div>
    <div class="sheet" id="sheet">
      <p class="cc" id="cc" aria-live="polite"></p>
    </div>
  </main>
  <script type="module" src="./main.ts"></script>
</body>
</html>
