<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="color-scheme" content="light" />
  <title>SIGNLAYER</title>
</head>
<body>
  <!-- The floating card (inside the page's glass frame, float.ts): grip header, the voice wave with Mic | Tab and
       Start, the signer, captions. Transparent: the frosted glass behind it belongs to the frame. -->
  <div class="card" id="card">
    <header class="hd" id="grip" title="Drag to move">
      <span class="brand" id="brand"></span>
      <div class="chip" id="pill" role="status" data-tone="idle">
        <span class="chip-in" id="islandIn"><i class="dot" id="dot"></i><b id="pillState">Ready</b><em id="pillSub" hidden></em></span>
      </div>
      <span class="sp"></span>
      <button class="ib sz" id="size" aria-label="Card size" title="Size">M</button>
      <button class="ib" id="gear" aria-label="Server" aria-expanded="false" title="Server"></button>
      <button class="ib" id="close" aria-label="Close SIGNLAYER" title="Close"></button>
    </header>
    <form class="server" id="server" hidden>
      <label for="apiUrl">Server</label>
      <input id="apiUrl" type="url" spellcheck="false" autocomplete="off" />
      <button type="submit">Save</button>
    </form>

    <section class="voice" id="voice" aria-label="Listening">
      <div class="seg" id="seg" role="radiogroup" aria-label="Listen to">
        <i class="thumb" aria-hidden="true"></i>
        <button role="radio" data-src="mic" aria-checked="false" aria-label="Microphone" title="Microphone"><span class="ic" id="icMic"></span></button>
        <button role="radio" data-src="tab" aria-checked="true" aria-label="This tab's audio" title="This tab's audio"><span class="ic" id="icTab"></span></button>
      </div>
      <canvas class="wv" id="wv" aria-hidden="true"></canvas>
      <button class="go" id="go" aria-pressed="false" aria-label="Start listening" title="Start listening"><span class="go-ic" id="goIc"></span></button>
    </section>

    <main class="stage-wrap" id="stageWrap">
      <i class="halo" aria-hidden="true"></i>
      <div class="stage" id="stage" data-state="ready">
        <canvas class="still" id="still" aria-hidden="true"></canvas>
        <video id="v0" muted playsinline preload="auto" aria-hidden="true"></video>
        <video id="v1" muted playsinline preload="auto" aria-hidden="true"></video>
        <div class="veil" aria-hidden="true"></div>
        <div class="focus" aria-live="polite">
          <p class="focus-text" id="focusText"></p>
          <div class="focus-actions" id="actions"></div>
        </div>
      </div>
    </main>

    <section class="sheet" aria-label="Captions">
      <p class="cc" id="cc" aria-live="polite"></p>
      <p class="note" id="note"></p>
    </section>
  </div>
  <script type="module" src="./main.ts"></script>
</body>
</html>
