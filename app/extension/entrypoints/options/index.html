<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="color-scheme" content="light" />
  <title>SIGNLAYER options</title>
  <style>
    body { padding: 28px; min-height: 100vh; }
    .box { max-width: 520px; padding: 24px; display: flex; flex-direction: column; gap: 12px; }
    form { display: flex; gap: 8px; }
    input { flex: 1; height: 34px; padding: 0 12px; border-radius: 999px; border: 1px solid rgb(21 25 58 / .15); font: 13px var(--font); }
    button { height: 34px; padding: 0 16px; border-radius: 999px; border: 0; background: var(--cobalt); color: #fff; cursor: pointer; }
    p { margin: 0; font-size: 12.5px; color: rgb(21 25 58 / .75); }
  </style>
</head>
<body class="g-paper grain">
  <div class="box glass">
    <span id="brand"></span>
    <span class="cap-label">Sign API URL</span>
    <form id="f"><input id="url" type="url" spellcheck="false" aria-label="API URL" /><button>Save</button></form>
    <p id="st">Default http://localhost:8787. On a phone or another laptop use http://&lt;LAN-IP&gt;:8787.</p>
  </div>
  <script type="module" src="./main.ts"></script>
</body>
</html>
