<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="color-scheme" content="dark" />
  <title>SIGNLAYER</title>
</head>
<body>
  <!-- The whole product: status on top, the signer in the middle, live captions under it, Mic | Tab audio + Start at the bottom. -->
  <header class="top">
    <span class="brand" id="brand"></span>
    <div class="island" id="pill" role="status" data-tone="idle">
      <span class="island-in" id="islandIn"><i class="dot" id="dot"></i><b id="pillState">Ready</b><em id="pillSub" hidden></em></span>
    </div>
    <button class="gear" id="gear" aria-label="Server" aria-expanded="false" title="Server"></button>
  </header>
  <form class="server" id="server" hidden>
    <label for="apiUrl">Server</label>
    <input id="apiUrl" type="url" spellcheck="false" autocomplete="off" />
    <button type="submit">Save</button>
  </form>

  <main class="stage-wrap">
    <div class="stage" id="stage" data-state="ready">
      <canvas class="still" id="still" aria-hidden="true"></canvas>
      <video id="v0" muted playsinline preload="auto" aria-hidden="true"></video>
      <video id="v1" muted playsinline preload="auto" aria-hidden="true"></video>
      <div class="veil" aria-hidden="true"></div>
      <div class="focus" aria-live="polite">
        <p class="focus-text" id="focusText"></p>
        <div class="focus-actions" id="actions"></div>
      </div>
    </div>
  </main>

  <section class="sheet" aria-label="Captions">
    <p class="cc" id="cc" aria-live="polite"></p>
    <p class="note" id="note"></p>
  </section>

  <footer class="controls">
    <div class="seg" id="seg" role="radiogroup" aria-label="Listen to">
      <i class="thumb" aria-hidden="true"></i>
      <button role="radio" data-src="mic" aria-checked="true"><span class="ic" id="icMic"></span>Mic</button>
      <button role="radio" data-src="tab" aria-checked="false"><span class="ic" id="icTab"></span>Tab audio</button>
    </div>
    <button class="go" id="go" aria-pressed="false"><i class="lvl" aria-hidden="true"></i><span class="go-ic" id="goIc"></span><span id="goText">Start</span></button>
  </footer>
  <script type="module" src="./main.ts"></script>
</body>
</html>
