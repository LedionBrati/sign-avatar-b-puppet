<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="color-scheme" content="light" />
  <title>Allow microphone · Flux</title>
  <style>
    /* The web app's light look: soft white melting into a pastel pink / violet / cyan glow, one white glass card. */
    body { min-height: 100vh; display: grid; place-items: center; padding: 24px; color: var(--label);
      background:
        radial-gradient(48% 52% at 18% 104%, rgb(255 170 230 / .8), rgb(255 170 230 / 0) 72%),
        radial-gradient(46% 50% at 56% 104%, rgb(160 150 255 / .75), rgb(160 150 255 / 0) 72%),
        radial-gradient(44% 58% at 100% 80%, rgb(120 232 255 / .8), rgb(120 232 255 / 0) 72%),
        linear-gradient(180deg, #f7f7fb 0%, #f4f3fb 45%, #eef0fd 100%) fixed; }
    .box { position: relative; width: min(420px, 100%); padding: 30px 28px 26px; border-radius: 30px; text-align: center;
      background: linear-gradient(160deg, rgb(255 255 255 / .8), rgb(255 255 255 / .62)); -webkit-backdrop-filter: blur(22px) saturate(160%); backdrop-filter: blur(22px) saturate(160%);
      box-shadow: inset 0 1px 0 #fff, inset 0 0 0 1px rgb(255 255 255 / .9), 0 30px 70px -30px rgb(60 50 140 / .4), 0 2px 8px rgb(60 50 140 / .06); }
    .brand { display: inline-flex; gap: 8px; align-items: center; }
    .brand .mark { width: 26px; height: 26px; filter: drop-shadow(0 4px 10px rgb(139 124 255 / .4)); }
    .brand .wm { font-size: 26px; }
    h1 { margin: 20px 0 8px; font: italic 500 30px/1.15 var(--font-serif); letter-spacing: -.02em; }
    p { margin: 0 0 18px; font-size: 14px; line-height: 1.5; color: var(--label-2); text-wrap: pretty; }
    button { height: 46px; padding: 0 24px; border-radius: 999px; border: 0; background: var(--accent-grad); color: #fff; font: 600 15px/1 var(--font); cursor: pointer;
      box-shadow: inset 0 1px 0 rgb(255 255 255 / .35), 0 0 0 1px rgb(255 255 255 / .3), 0 10px 26px -10px rgb(68 70 216 / .9); }
    #msg { min-height: 1.4em; margin-bottom: 14px; font-size: 13.5px; }
    .ok { color: #1f8a5c; font-weight: 600; } .bad { color: #c62a40; font-weight: 600; }
  </style>
</head>
<body>
  <div class="box">
    <span class="brand" id="brand"></span>
    <h1>Allow the microphone</h1>
    <p>The floating card can't ask for the microphone itself, so Chrome asks here, once. Speech goes to your Flux server for speech-to-text.</p>
    <p id="msg"></p>
    <button id="go" hidden>Try again</button>
  </div>
  <script type="module" src="./main.ts"></script>
</body>
</html>
