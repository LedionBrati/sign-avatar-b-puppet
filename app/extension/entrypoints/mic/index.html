<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="color-scheme" content="dark" />
  <title>Allow microphone · SIGNLAYER</title>
  <style>
    body { min-height: 100vh; display: grid; place-items: center; padding: 24px; color: #f5f5f7;
      background: radial-gradient(80% 50% at 50% 0%, rgb(58 91 240 / .18), transparent 60%), #0b0c10; }
    .box { width: min(400px, 100%); text-align: center; }
    .brand { display: inline-flex; gap: 8px; align-items: center; }
    .brand .wm { --wm-ink: #f5f5f7; --wm-dot: #5b78ff; font-size: 17px; }
    h1 { margin: 22px 0 8px; font: 600 22px/1.2 var(--font-display); letter-spacing: -.02em; }
    p { margin: 0 0 18px; font-size: 13.5px; line-height: 1.5; color: rgb(245 245 247 / .62); }
    button { height: 44px; padding: 0 22px; border-radius: 999px; border: 0; background: linear-gradient(180deg, #5b78ff, #3a5bf0); color: #fff; font-size: 14px; font-weight: 600; cursor: pointer; }
    #msg { min-height: 1.4em; font-size: 13px; }
    .ok { color: #7ee2b8; } .bad { color: #ff8a84; }
  </style>
</head>
<body>
  <div class="box">
    <span class="brand" id="brand"></span>
    <h1>Allow the microphone</h1>
    <p>The floating card can't ask for the microphone itself, so Chrome asks here, once. Speech goes to your SIGNLAYER server for speech-to-text.</p>
    <p id="msg"></p>
    <button id="go" hidden>Try again</button>
  </div>
  <script type="module" src="./main.ts"></script>
</body>
</html>
