<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="color-scheme" content="light" />
  <title>Enable microphone · SIGNLAYER</title>
  <style>
    body { min-height: 100vh; display: grid; place-items: center; padding: 24px; color: #fff; }
    .box { width: min(440px, 100%); padding: 28px; color: var(--ink); }
    .box .wm { font-size: 20px; }
    h1 { margin: 22px 0 8px; font: 400 24px/1.1 var(--font); text-transform: uppercase; color: var(--ink-blue); }
    p { margin: 0 0 18px; font-size: 14px; line-height: 1.5; color: rgb(21 25 58 / .75); }
    button { height: 42px; padding: 0 20px; border-radius: 999px; border: 0; background: var(--cobalt); color: #fff; font-size: 14px; cursor: pointer; box-shadow: 0 8px 20px -10px rgb(31 63 214 / .9); }
    #msg { margin-top: 14px; min-height: 1.4em; font-size: 13px; }
    .ok { color: #138a63; } .bad { color: #c0353a; }
  </style>
</head>
<body class="g-paper grain">
  <div class="box glass">
    <span id="brand"></span>
    <h1>Enable the microphone</h1>
    <p>The SIGNLAYER side panel listens to speech near you and signs it on the page you're on. Chrome needs your permission once. Audio is recognised by your browser and never stored by SIGNLAYER.</p>
    <button id="go">Enable microphone</button>
    <p id="msg"></p>
  </div>
  <script type="module" src="./main.ts"></script>
</body>
</html>
