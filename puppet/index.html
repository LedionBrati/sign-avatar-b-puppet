<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Puppet Viewer</title>
  <link rel="icon" href="data:," />
  <style>
    :root { --bg: #0e0f12; --panel: #16181d; --text: #e6e7ea; --muted: #9aa0aa; --accent: #ff9a3c; }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html, body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, "Segoe UI", sans-serif; }
    body.render { overflow: hidden; }
    #panels { display: flex; gap: 8px; padding: 8px; justify-content: center; flex-wrap: wrap; }
    body.render #panels { gap: 0; padding: 0; justify-content: flex-start; flex-wrap: nowrap; }
    .panel { position: relative; background: var(--panel); }
    .panel > canvas, .panel > video { display: block; width: 100%; height: 100%; }
    .panel > canvas.overlay { position: absolute; inset: 0; pointer-events: none; }
    .panel .tag { position: absolute; left: 8px; top: 6px; font-weight: 600; font-size: 14px; background: rgba(0,0,0,.55); padding: 2px 6px; border-radius: 4px; }
    #controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: center; padding: 6px 12px 12px; }
    #controls button, #controls select { background: #23262d; color: var(--text); border: 1px solid #343842; border-radius: 6px; padding: 5px 10px; font: inherit; cursor: pointer; }
    #controls input[type=range] { width: min(420px, 60vw); }
    #status { text-align: center; color: var(--muted); padding: 0 12px 10px; min-height: 2.8em; white-space: pre-wrap; }
    #status .bad { color: #ff6b6b; }
    #error { color: #ff6b6b; padding: 16px; white-space: pre-wrap; }
    @media (max-width: 700px) { #panels .panel { width: calc(100vw - 16px) !important; height: auto !important; aspect-ratio: 3 / 4; } }
  </style>
</head>
<body>
  <div id="panels"></div>
  <div id="controls" hidden>
    <button id="play">Play</button>
    <button id="prev" title="previous frame (←)">◀ frame</button>
    <button id="next" title="next frame (→)">frame ▶</button>
    <input id="seek" type="range" min="0" max="0" value="0" />
    <label>speed <select id="speed"><option>0.25</option><option>0.5</option><option selected>1</option><option>1.5</option><option>2</option></select></label>
    <label><input id="closeup" type="checkbox" /> hand close-up</label>
    <label>solver <select id="solver"><option value="direct">direct</option><option value="kalidokit">kalidokit</option></select></label>
  </div>
  <div id="status"></div>
  <div id="error"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
